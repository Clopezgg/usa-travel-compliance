name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check web/entrysafe-v4.js && node --check web/entrysafe-core-v4.js && node --check web/catalog-v4.js && node --check web/catalog-v3.js && node --check web/trip-management-v4.js && node --check web/trip-management-v3.js && node --check web/supabase-local.js && node --check web/sw.js && node --check tests/entrysafe-v4.mjs && node --check tests/trip-lifecycle-v4.mjs && node --check tests/airline-policy-v4.mjs && node --check tests/catalog-v3.mjs
      - name: Definitive product certification
        run: node tests/entrysafe-v4.mjs
      - name: Trip lifecycle certification
        run: node tests/trip-lifecycle-v4.mjs
      - name: Airline policy separation certification
        run: node tests/airline-policy-v4.mjs
      - name: Base catalog certification
        run: node tests/catalog-v3.mjs
