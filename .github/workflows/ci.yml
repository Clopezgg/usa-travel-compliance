name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check web/entrysafe-v3.js && node --check web/trip-management-v3.js && node --check web/catalog-v3.js && node --check web/supabase-local.js && node --check web/sw.js && node --check tests/smoke.mjs && node --check tests/catalog-v3.mjs
      - name: Product smoke checks
        run: node tests/smoke.mjs
      - name: Catalog certification
        run: node tests/catalog-v3.mjs
